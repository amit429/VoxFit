<vox-page-header variant="auth">
  <ion-back-button header-start defaultHref="/auth/welcome" text="" aria-label="Back" />
</vox-page-header>

<ion-content class="auth-flow">
  <div class="auth-flow-inner">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
      <span class="auth-page-eyebrow">VoxFit</span>
      <h1 class="auth-page-title">Create account</h1>
      <p class="auth-page-lead">Voice-first logging on every device. Use a strong password you don’t reuse elsewhere.</p>

      <div class="auth-form-stack">
        <ion-input
          formControlName="displayName"
          type="text"
          label="Name (optional)"
          labelPlacement="floating"
          fill="outline"
          autocomplete="name"
        />
        <ion-input
          formControlName="email"
          type="email"
          label="Email"
          labelPlacement="floating"
          fill="outline"
          autocomplete="email"
          inputmode="email"
        />
        <ion-input
          formControlName="password"
          type="password"
          label="Password"
          labelPlacement="floating"
          fill="outline"
          autocomplete="new-password"
        />
        <p class="auth-hint">At least 8 characters.</p>
      </div>

      @if (errorMessage) {
        <div class="auth-banner auth-banner--error mt-4" role="alert">{{ errorMessage }}</div>
      }
      @if (infoMessage) {
        <div class="auth-banner auth-banner--info mt-4" role="status">{{ infoMessage }}</div>
      }

      <button type="submit" [disabled]="loading" class="vox-btn-primary mt-4 w-full">
        @if (loading) {
          Creating…
        } @else {
          Create account
        }
      </button>

      <a routerLink="/auth/login" class="vox-btn-ghost mt-5 w-full no-underline">
        Already have an account? <span class="pl-1 text-primary">Sign in</span>
      </a>
    </form>
  </div>
</ion-content>
