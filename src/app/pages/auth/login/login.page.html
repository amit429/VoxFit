<vox-page-header variant="auth">
  <ion-back-button header-start defaultHref="/auth/welcome" text="" aria-label="Back" />
</vox-page-header>

<ion-content class="auth-flow">
  <div class="auth-flow-inner">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
      <span class="auth-page-eyebrow">Welcome back</span>
      <h1 class="auth-page-title">Sign in</h1>
      <p class="auth-page-lead">Enter the email and password you used for VoxFit.</p>

      <div class="auth-form-stack">
        <ion-input
          formControlName="email"
          type="email"
          label="Email"
          labelPlacement="floating"
          fill="outline"
          autocomplete="email"
          inputmode="email"
        />
        <ion-input
          formControlName="password"
          type="password"
          label="Password"
          labelPlacement="floating"
          fill="outline"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage) {
        <div class="auth-banner auth-banner--error mt-4" role="alert">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="loading" class="vox-btn-primary mt-4 w-full">
        @if (loading) {
          Signing in…
        } @else {
          Sign in
        }
      </button>

      <a routerLink="/auth/register" class="vox-btn-ghost mt-5 w-full no-underline">
        New here? <span class="pl-1 text-primary">Create an account</span>
      </a>
    </form>
  </div>
</ion-content>
