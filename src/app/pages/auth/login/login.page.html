<ion-header class="ion-no-border">
  <ion-toolbar class="auth-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/welcome" text="" aria-label="Back" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-flow">
  <div class="auth-flow-inner">
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
      <span class="auth-page-eyebrow">Welcome back</span>
      <h1 class="auth-page-title">Sign in</h1>
      <p class="auth-page-lead">Enter the email and password you used for VoxFit.</p>

      <div class="auth-form-stack">
        <ion-input
          formControlName="email"
          type="email"
          label="Email"
          labelPlacement="floating"
          fill="outline"
          autocomplete="email"
          inputmode="email"
        />
        <ion-input
          formControlName="password"
          type="password"
          label="Password"
          labelPlacement="floating"
          fill="outline"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage) {
        <div class="auth-banner auth-banner--error mt-4" role="alert">{{ errorMessage }}</div>
      }

      <button
        type="submit"
        [disabled]="loading"
        class="mt-2 inline-flex h-[3.25rem] w-full shrink-0 items-center justify-center rounded-[14px] bg-[var(--ion-color-primary)] text-base font-semibold text-[var(--ion-color-primary-contrast)] shadow-sm transition-[opacity,transform] enabled:active:scale-[0.98] disabled:pointer-events-none disabled:opacity-45"
      >
        @if (loading) {
          Signing in…
        } @else {
          Sign in
        }
      </button>

      <a
        routerLink="/auth/register"
        class="mt-1 inline-flex w-full items-center justify-center py-2.5 text-sm font-medium text-[var(--ion-color-medium)] no-underline active:opacity-80"
      >
        New here? <span class="pl-1 text-[var(--ion-color-primary)]">Create an account</span>
      </a>
    </form>
  </div>
</ion-content>
