<ion-content [fullscreen]="false" class="welcome-content">
  <div class="welcome-stack flex w-full max-w-sm flex-col items-center gap-8 px-6 py-8 text-center">
    <div
      class="flex h-[4.25rem] w-[4.25rem] shrink-0 items-center justify-center rounded-lg border border-hairline bg-surface-2"
    >
      <vox-icon name="mic-outline" size="xl" tone="accent" />
    </div>

    <div class="flex flex-col gap-3">
      <span class="text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-primary">VoxFit</span>
      <h1 class="m-0 text-[1.75rem] font-semibold leading-tight tracking-[-0.5px] text-ink">
        Speak it.<br />
        Track it.
      </h1>
      <p class="m-0 text-[0.9375rem] leading-relaxed text-ink-subtle">
        Log workouts and meals with your voice—no forms, no friction.
      </p>
    </div>

    <div class="flex w-full flex-col gap-2.5">
      <a routerLink="/auth/register" class="vox-btn-primary w-full no-underline">
        Get started
        <vox-icon name="arrow-forward-outline" size="md" tone="inherit" />
      </a>
      <a routerLink="/auth/login" class="vox-btn-ghost w-full no-underline">
        I already have an account
      </a>
    </div>
  </div>
</ion-content>
