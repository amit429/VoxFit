<ion-content [fullscreen]="false" class="welcome-content">
  <div class="welcome-stack flex w-full max-w-sm flex-col items-center gap-6 px-6 py-4 text-center">
    <div
      class="flex h-[4.25rem] w-[4.25rem] shrink-0 items-center justify-center rounded-[1.125rem] border border-[var(--ion-border-color)] bg-[rgba(255,255,255,0.04)] shadow-[0_20px_40px_-24px_rgba(0,0,0,0.9)]"
    >
      <ion-icon name="mic-outline" class="text-[2rem] text-[var(--ion-color-primary)]" aria-hidden="true" />
    </div>

    <div class="flex flex-col gap-3">
      <span class="text-[0.6875rem] font-semibold uppercase tracking-[0.14em] text-[var(--ion-color-primary)]">VoxFit</span>
      <h1 class="m-0 text-[1.75rem] font-bold leading-tight tracking-tight text-[var(--ion-text-color)]">
        Speak it.<br />
        Track it.
      </h1>
      <p class="m-0 text-[0.9375rem] leading-relaxed text-[var(--ion-color-medium)]">
        Log workouts and meals with your voice—no forms, no friction.
      </p>
    </div>

    <div class="flex w-full flex-col gap-2.5">
      <a
        routerLink="/auth/register"
        class="inline-flex h-[3.25rem] w-full items-center justify-center gap-2 rounded-[14px] bg-[var(--ion-color-primary)] text-base font-semibold text-[var(--ion-color-primary-contrast)] no-underline shadow-sm transition-[opacity,transform] active:scale-[0.98] active:opacity-90"
      >
        Get started
        <ion-icon name="arrow-forward-outline" class="text-xl" aria-hidden="true" />
      </a>
      <a
        routerLink="/auth/login"
        class="inline-flex w-full items-center justify-center py-2.5 text-sm font-medium text-[var(--ion-color-medium)] no-underline active:opacity-80"
      >
        I already have an account
      </a>
    </div>
  </div>
</ion-content>
