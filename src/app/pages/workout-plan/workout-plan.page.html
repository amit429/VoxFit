<ion-content class="tab-page-content">
  <div class="vx-atmo" aria-hidden="true">
    <span class="vx-blob wp-blob-1"></span>
    <span class="vx-blob wp-blob-2"></span>
  </div>
  <div class="vx-grain" aria-hidden="true"></div>

  <div class="vx-layer flex min-h-full flex-col">
    <header class="flex shrink-0 items-center justify-between gap-3 pb-4 pt-1">
      <button type="button" [routerLink]="'/tabs/workout'" class="vx-icon-btn" aria-label="Back to Train">
        <vox-icon name="chevron-back-outline" size="sm" tone="ink" />
      </button>
      <span class="wp-header-title">My Plan</span>
      <span class="vx-icon-spacer"></span>
    </header>

    <main class="flex flex-1 flex-col pb-6">
      @if (loadingActive()) {
        <div class="wp-stack" aria-busy="true">
          <vox-skeleton height="188px" radius="xl" class="block" />
          <vox-skeleton height="74px" radius="xl" class="block" />
          <vox-skeleton height="62px" radius="xl" class="block" />
          <vox-skeleton height="62px" radius="xl" class="block" />
          <vox-skeleton height="62px" radius="xl" class="block" />
        </div>
      } @else if (generating()) {
        <vox-plan-building [daysPerWeek]="daysPerWeek()" [rebuilding]="!!planService.activePlan()" />
      } @else {
        <div class="wp-stack" [class.wp-stack--centred]="!planService.activePlan()">
          <!-- A failed generation keeps the existing plan on screen underneath;
               the error is a strip above it, not a replacement for it. -->
          @if (error(); as err) {
            <div class="wp-error" role="alert">
              <vox-icon name="refresh-outline" size="sm" tone="rose" />
              <div class="wp-error-body">
                <p class="wp-error-text">{{ err }}</p>
                <button type="button" class="wp-error-retry" (click)="requestGenerate()">Try again</button>
              </div>
            </div>
          }

          @if (planService.activePlan(); as active) {
            <vox-plan-hero [plan]="active.plan" [createdAt]="active.created_at" />

            <vox-plan-accommodation [accommodations]="active.plan.accommodations" />

            <vox-plan-rationale
              [short]="active.plan.rationale_short"
              [full]="active.plan.rationale_full"
            />

            <section class="wp-week">
              <div class="wp-week-head">
                <h2 class="wp-week-title">The week</h2>
                @if (totalExercises(); as count) {
                  <span class="wp-week-count">{{ count }} exercises</span>
                }
              </div>

              <div class="wp-days">
                @for (day of active.plan.days; track day.day) {
                  <vox-plan-day
                    [day]="day"
                    [expanded]="openDay() === day.day"
                    (toggled)="toggleDay(day.day)"
                  />
                }
              </div>
            </section>

            <vox-plan-regenerate
              mode="regenerate"
              [daysPerWeek]="daysPerWeek()"
              (daysPerWeekChange)="setDaysPerWeek($event)"
              (generate)="requestGenerate()"
            />
          } @else {
            <vox-plan-regenerate
              mode="create"
              [daysPerWeek]="daysPerWeek()"
              (daysPerWeekChange)="setDaysPerWeek($event)"
              (generate)="requestGenerate()"
            />
          }
        </div>
      }
    </main>
  </div>

  <vox-confirm-dialog
    [open]="confirmOpen()"
    heading="Replace your current plan?"
    body="This builds a fresh plan from your latest sessions. Your current plan is replaced and can't be brought back."
    confirmLabel="Regenerate"
    (confirmed)="confirmRegenerate()"
    (dismissed)="confirmOpen.set(false)"
  />
</ion-content>
