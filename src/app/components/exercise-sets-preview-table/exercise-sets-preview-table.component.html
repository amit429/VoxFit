@if (exerciseType() === 'strength') {
  <ul class="est-list">
    @for (row of setRows(); track row.index) {
      <li>
        <button
          type="button"
          class="est-row"
          [class.est-row--hi]="highlightRowIndex() === row.index"
          (click)="onRowClick(row.index)"
        >
          <span class="est-label">SET {{ row.index }}</span>
          <span class="est-value">
            @if (row.sets > 1) {
              <span class="est-multi">{{ row.sets }}×</span>
            }
            {{ row.weightKg !== null ? row.weightKg : '—' }}<span class="est-unit">kg</span>
            <span class="est-times">×</span>
            {{ row.repsDisplay ?? '—' }}
          </span>
        </button>
      </li>
    }
  </ul>
} @else {
  <ul class="est-list">
    @for (row of setRows(); track row.index) {
      <li>
        <button
          type="button"
          class="est-row"
          [class.est-row--hi]="highlightRowIndex() === row.index"
          (click)="onRowClick(row.index)"
        >
          <span class="est-label">{{ row.segmentLabel ?? 'SEGMENT ' + row.index }}</span>
          <span class="est-value">
            @if (row.sets > 1) {
              <span class="est-multi">{{ row.sets }}×</span>
            }
            @if (row.durationDisplay) {
              {{ row.durationDisplay }}
            }
            @if (row.durationDisplay && row.distanceDisplay) {
              <span class="est-times">·</span>
            }
            @if (row.distanceDisplay) {
              {{ row.distanceDisplay }}<span class="est-unit">km</span>
            }
            @if (!row.durationDisplay && !row.distanceDisplay) {
              —
            }
          </span>
        </button>
      </li>
    }
  </ul>
}
