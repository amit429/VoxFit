<app-exercise-editor-modal
  [isOpen]="editorOpen()"
  [exercise]="editingExercise()"
  [focusSetRowIndex]="editorFocusSetRowIndex()"
  (dismissed)="onEditorDismissed()"
  (saved)="onEditorSaved($event)"
/>

<div class="vox-session-card">
  <p class="vox-session-card__title">{{ sessionTitle() }}</p>
  @if (coachSummary()) {
    <div class="vox-coach-note">
      <p class="vox-coach-note__label">Coach</p>
      <p class="vox-coach-note__body">{{ coachSummary() }}</p>
    </div>
  }

  <div class="vox-exercise-list">
    @for (ex of voiceExerciseRows(); track $index; let i = $index) {
      <div class="vox-exercise-card" [class.vox-exercise-card--open]="isExerciseExpanded(i)">
        <div class="vox-exercise-card__head">
          <button
            type="button"
            class="vox-exercise-trigger"
            (click)="toggleExercise(i)"
            [attr.aria-expanded]="isExerciseExpanded(i)"
            [attr.aria-controls]="'vox-exercise-panel-' + i"
            [id]="'vox-exercise-trigger-' + i"
          >
            <div class="vox-exercise-trigger__main">
              <div class="vox-exercise-trigger__title-row">
                <span class="vox-exercise-name">{{ ex.name }}</span>
                @if (ex.isPr) {
                  <span class="vox-exercise-pr">PR</span>
                }
                @if (ex.exerciseType === 'cardio') {
                  <span class="vox-exercise-type-chip">Cardio</span>
                }
              </div>
            </div>
            <ion-icon
              class="vox-exercise-ion-chevron"
              [name]="isExerciseExpanded(i) ? 'chevron-up-outline' : 'chevron-down-outline'"
              aria-hidden="true"
            />
          </button>
          <button type="button" class="vox-icon-btn" (click)="openExerciseEditor(i, undefined, $event)" aria-label="Edit exercise">
            <ion-icon name="create-outline" />
          </button>
        </div>

        @if (isExerciseExpanded(i)) {
          <div class="vox-exercise-panel" [id]="'vox-exercise-panel-' + i" role="region" [attr.aria-labelledby]="'vox-exercise-trigger-' + i">
            @if (ex.setRows.length === 0) {
              <p class="vox-exercise-panel__empty">No set breakdown — tap edit to add rows.</p>
              <button type="button" class="vox-panel-edit-link" (click)="openExerciseEditor(i)">Edit exercise</button>
            } @else {
              <p class="vox-panel-hint">Tap a row to edit</p>
              <app-exercise-sets-preview-table
                [exerciseType]="ex.exerciseType"
                [setRows]="ex.setRows"
                [highlightRowIndex]="highlightRowForExercise(i)"
                (rowClick)="openExerciseEditor(i, $event)"
              />
            }
          </div>
        }
      </div>
    }
  </div>
</div>
