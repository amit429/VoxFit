<section class="rounded-2xl bg-surface-1 p-5 ring-1 ring-hairline">
  @if (rationale()) {
    <p class="m-0 mb-4 text-sm leading-relaxed text-ink-subtle">{{ rationale() }}</p>
  }
  @for (day of plan().days; track day.day_label) {
    <div class="mb-4 last:mb-0">
      <header class="mb-2">
        <h3 class="m-0 text-sm font-semibold text-ink">{{ day.day_label }}</h3>
        <p class="m-0 mt-0.5 text-xs text-ink-subtle">{{ day.focus }}</p>
      </header>
      <ul class="m-0 list-none space-y-2 p-0">
        @for (ex of day.exercises; track ex.name) {
          <li class="border-b border-hairline pb-2 last:border-b-0 last:pb-0">
            <div class="flex items-baseline justify-between gap-3">
              <span class="text-sm text-ink">{{ ex.name }}</span>
              <span class="shrink-0 font-mono text-xs text-ink-subtle">{{ ex.sets ?? '—' }} × {{ ex.reps ?? '—' }}</span>
            </div>
            @if (ex.note) {
              <p class="m-0 mt-0.5 text-xs text-ink-tertiary">{{ ex.note }}</p>
            }
          </li>
        }
      </ul>
    </div>
  }
</section>
