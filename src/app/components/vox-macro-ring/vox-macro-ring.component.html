<div class="mr-gauge">
  <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="36" r="29" fill="none" stroke="rgba(255,255,255,.11)" stroke-width="8" />
    <circle
      class="mr-fill"
      cx="36"
      cy="36"
      r="29"
      fill="none"
      [attr.stroke]="stroke()"
      stroke-width="8"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashOffset()"
      transform="rotate(-90 36 36)"
    />
    <text x="36" y="41" text-anchor="middle" class="mr-pct">{{ pct() }}%</text>
  </svg>
  <p class="mr-label">{{ label() }}</p>
  <p class="mr-figures">
    {{ value() }}/{{ target() }}<span class="mr-unit">{{ unit() }}</span>
  </p>
</div>
