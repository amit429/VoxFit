<ion-modal [isOpen]="isOpen()" class="vox-streak-modal" (ionModalDidDismiss)="dismissed.emit()">
  <ng-template>
    <div class="sc">
      <div class="sc-atmo" aria-hidden="true">
        <span class="sc-blob sc-blob--1"></span>
        <span class="sc-blob sc-blob--2"></span>
        <span class="sc-blob sc-blob--3"></span>
      </div>

      <div class="sc-body">
        <div class="sc-close-row">
          <button type="button" class="sc-close" (click)="dismissed.emit()" aria-label="Close">
            <vox-icon name="close-outline" size="sm" tone="ink" />
          </button>
        </div>

        <div class="sc-hero">
          <p class="sc-flame" aria-hidden="true">🔥</p>
          <p class="sc-count">{{ days() }}</p>
          <p class="sc-unit">Day streak</p>

          <p class="sc-headline">{{ headline() }}</p>
          <p class="sc-sub">{{ subline() }}</p>

          @if (weekDots().length) {
            <div class="sc-dots">
              @for (dot of weekDots(); track $index; let last = $last) {
                <span
                  class="sc-dot"
                  [class.sc-dot--done]="dot.completed"
                  [class.sc-dot--today]="dot.completed && last"
                  [attr.aria-label]="dot.label"
                >
                  @if (dot.completed) {
                    <vox-icon name="checkmark-outline" size="xs" tone="inherit" />
                  }
                </span>
              }
            </div>
          }
        </div>

        <button type="button" class="sc-cta" (click)="dismissed.emit()">Keep going</button>
      </div>
    </div>
  </ng-template>
</ion-modal>
