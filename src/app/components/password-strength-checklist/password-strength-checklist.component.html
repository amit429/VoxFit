@if (password()) {
  <div class="auth-password-checklist" role="status">
    <p class="auth-password-checklist__strength">{{ strengthLabel() }}</p>
    <ul class="auth-password-checklist__list">
      @for (rule of rules(); track rule.key) {
        <li [class.auth-password-checklist__item--ok]="rule.passed">
          <vox-icon
            [name]="rule.passed ? 'checkmark-circle' : 'ellipse-outline'"
            [tone]="rule.passed ? 'success' : 'ink-subtle'"
            size="xs"
          />
          {{ rule.label }}
        </li>
      }
    </ul>
  </div>
}
