<div class="mm">
  <p class="mm-title">This week you hit</p>
  <p class="mm-caption">{{ caption() }}</p>

  @if (hasData()) {
    <div class="mm-body">
      <!--
        Front-view figure. Base shapes are drawn once in a muted fill, then the
        trainable regions are drawn over them so a fill change is the only thing
        that differs between states.
      -->
      <svg width="112" height="150" viewBox="0 0 112 150" class="mm-figure" aria-hidden="true">
        <g fill="rgba(255,255,255,.13)">
          <ellipse cx="56" cy="15" rx="10" ry="12" />
          <rect x="46" y="27" width="20" height="7" rx="3" />
          <path d="M38 36h36l5 30H33l5-30Z" />
          <rect x="24" y="38" width="12" height="34" rx="6" />
          <rect x="76" y="38" width="12" height="34" rx="6" />
          <rect x="24" y="70" width="11" height="28" rx="5" />
          <rect x="77" y="70" width="11" height="28" rx="5" />
          <path d="M35 68h42l-3 24H38l-3-24Z" />
          <rect x="39" y="92" width="14" height="34" rx="7" />
          <rect x="59" y="92" width="14" height="34" rx="7" />
          <rect x="41" y="124" width="11" height="24" rx="5" />
          <rect x="60" y="124" width="11" height="24" rx="5" />
        </g>

        <!-- Chest -->
        <path d="M38 36h36l3 18H35l3-18Z" [attr.fill]="fill('chest')" opacity=".92" />
        <!-- Shoulders (deltoid caps) -->
        <rect x="24" y="38" width="12" height="16" rx="6" [attr.fill]="fill('shoulders')" opacity=".9" />
        <rect x="76" y="38" width="12" height="16" rx="6" [attr.fill]="fill('shoulders')" opacity=".9" />
        <!-- Arms (upper arm + forearm) -->
        <rect x="25" y="54" width="10" height="18" rx="5" [attr.fill]="fill('arms')" opacity=".9" />
        <rect x="77" y="54" width="10" height="18" rx="5" [attr.fill]="fill('arms')" opacity=".9" />
        <rect x="24" y="70" width="11" height="26" rx="5" [attr.fill]="fill('arms')" opacity=".78" />
        <rect x="77" y="70" width="11" height="26" rx="5" [attr.fill]="fill('arms')" opacity=".78" />
        <!-- Core -->
        <path d="M37 70h38l-2 20H39l-2-20Z" [attr.fill]="fill('core')" opacity=".9" />
        <!-- Legs (quads + calves) -->
        <rect x="39" y="92" width="14" height="34" rx="7" [attr.fill]="fill('legs')" opacity=".92" />
        <rect x="59" y="92" width="14" height="34" rx="7" [attr.fill]="fill('legs')" opacity=".92" />
        <rect x="41" y="124" width="11" height="24" rx="5" [attr.fill]="fill('legs')" opacity=".7" />
        <rect x="60" y="124" width="11" height="24" rx="5" [attr.fill]="fill('legs')" opacity=".7" />
      </svg>

      <div class="mm-chips">
        @for (chip of chips(); track chip.key) {
          <vox-badge [tone]="chipTone(chip)" size="xs">{{ chip.label }}</vox-badge>
        }
      </div>
    </div>
  } @else {
    <p class="mm-empty">
      Log a session and the muscles you trained show up here.
    </p>
  }
</div>
